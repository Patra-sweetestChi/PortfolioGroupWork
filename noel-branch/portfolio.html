<style>
    .box{
        border-radius: 20%;
    
    }
    .btncta{
        border: 1px solid green ;
        border-radius: 7px;
        padding: 2px;
        background-color: white;
        color: black;
        z-index: 1;
        position: relative;
        width: 100px;
    }
    .btncta .bc {
        position: absolute;
        top: 0;
        left: 0;
        width: 0%;
        height: 100%;
        z-index: -1;
        background-color: green;
        transition: 1s;

    }
    .btncta .cb {
        position: absolute;
        top: 0;
        left: 0;
        width: 0%;
        height: 50%;
        z-index: -1;
        background-color: rgb(238, 255, 0);
        transition: 1s;

    }
    .btncta:hover .cb{
        width: 100%;
        border-top-left-radius: 7px;
        border-top-right-radius: 7px;
    }
    .btncta:hover .bc{
        width: 100%;
        border-radius: 7px;
    }

    .hero-title{
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        border-right: 2px solid black;
        animation: type 4s steps(30) forwards, blink 1s step-end infinite;

    }
    @keyframes type {
        to {
            width: 45%;
        }
        50%{
            border-color: transparent;
        }
        
    }
    .hero-subtitle{
         overflow: hidden;
        white-space: nowrap;
        font-size: 30px;
        width: 0;
        border-right: 2px solid  wheat;
        animation: typ 7s steps(200) forwards infinite, blin 1s step-end infinite;
    }

     @keyframes typ {
        to {
            width: 110%;
        }
        50%{
            border-color: transparent;
            color: greenyellow;
        }
    }
        


</style>
